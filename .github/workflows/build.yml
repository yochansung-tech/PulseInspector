name: Build PulseInspector

on:
  push:
    branches:
      - main
      - 'ai/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PulseInspector.sln

      - name: Build Release
        run: dotnet build PulseInspector.sln --configuration Release --no-restore

      - name: Run algorithm tests
        run: dotnet run --project PulseInspector.Tests/PulseInspector.Tests.csproj --configuration Release --no-build
